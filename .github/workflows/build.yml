name: Build Extension

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Extract version
        id: version
        run: |
          # 从 pom.xml 读取版本号，去掉 -SNAPSHOT 后缀
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout 2>/dev/null \
            | sed 's/-SNAPSHOT$//')
          if [ -z "$VERSION" ]; then
            echo "错误: 无法从 pom.xml 提取版本号"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "==> Version: $VERSION (来源: pom.xml)"

      - name: Build with Maven
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mvn clean package -B -DskipTests
          mkdir -p dist
          cp target/slave-prerequisites.hpi "dist/slave-prerequisites-v${VERSION}.hpi"
          echo "==> 已生成: dist/slave-prerequisites-v${VERSION}.hpi"

      - name: Run tests
        run: mvn test -B

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slave-prerequisites-v${{ steps.version.outputs.version }}
          path: |
            dist/*.hpi
            target/slave-prerequisites.hpi
          retention-days: 90

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.hpi
          generate_release_notes: true
