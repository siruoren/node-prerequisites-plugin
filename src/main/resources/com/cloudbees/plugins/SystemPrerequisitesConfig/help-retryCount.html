<div>
    Maximum number of retry attempts when a prerequisite check fails.
    After each failure, the check will be retried after the configured
    retry interval. Once a retry passes, the node is accepted and the
    queued task can execute on it.
    <br/><br/>
    Set to <code>0</code> to disable retries (fail immediately).
    <br/>
    Default: <code>3</code>
</div>
